<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily Devotional App - Read, reflect, and grow spiritually with daily Bible passages and guided reflections.">
    <meta name="theme-color" content="#667eea">
<!-- Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="Daily Devotional">
  
  <!-- Icons -->
  <!-- <link rel="manifest" href="/onethingwebapp/manifest.json"> -->
  <link rel="apple-touch-icon" href="/onethingwebapp/icon-192.png">
  <link rel="icon" type="image/png" href="/onethingwebapp/icon-192.png">

     <!-- PREVENT CACHING OF HTML/CSS/JS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    
    <title>One Thing (mobile version)</title>
   
    <!-- Update whenever there are changes -->

<!-- Use below for web testing 
 <link rel="stylesheet" href="/onethingwebapp/styles.css?v=2.2.01"> -->    
<link rel="stylesheet" href="/onethingwebapp/styles.css?v=2.1.03">      
</head>
<body>
    <div class="container">
        
        <!-- Header -->
        <header>
            <h1>ONE THING</h1>
            A GPC Devotional Resource

        <!-- ⭐ HAMBURGER MENU BUTTON ⭐ -->
           <button class="hamburger-btn" id="hamburgerBtn" title="Menu">
               <span></span>
               <span></span>
               <span></span>
           </button>

        </header>
        <!-- ⭐ EXPANDABLE MENU ⭐ -->
       <nav class="menu-bar" id="menuBar">
           <button class="menu-btn active" data-section="daily-devotional">
               Today's Devotional
           </button>
           <button class="menu-btn" data-section="sermon-series">
               Current Sermon Series Intro
           </button>
           <button class="menu-btn" data-section="why-spend-time">
               Why Spend Time with God?
           </button>
            <button class="menu-btn" data-section="about-one-thing">
               About One Thing
           </button>
           <button class="menu-btn" data-section="connect-with-GPC">
               Connect with GPC
           </button>
            <button class="menu-btn" id="fs-auth-btn" data-section="auth-sync">
                Sync with Google Sign-In
            </button>
        <span id="fs-user-info" style="font-size:0.8em; color:#555; margin-left:0.5rem;"></span>

</div>
       </nav>

<!-- Firebase Sync Widget -->
    <div id="fs-widget" style="font-family:system-ui,sans-serif; padding:1rem; border:1px solid #ddd; border-radius:8px; max-width:420px;">
        <div id="fs-auth-row" style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <button id="fs-signin" type="button">Sign in with Google</button>
            <button id="fs-signout" type="button" style="display:none;">Sign out</button>
            <span id="fs-user" style="font-size:0.9rem; color:#444;"></span>
        </div>
        <div id="fs-sync-row" style="display:none; margin-top:0.75rem; gap:0.5rem; flex-wrap:wrap;">
            <button id="fs-backup" type="button">☁️ Backup to Drive</button>
            <button id="fs-restore" type="button">⬇️ Restore from Drive</button>
        </div>
        <div id="fs-status" style="margin-top:0.5rem; font-size:0.85rem; color:#2e7d32; min-height:1.2rem;"></div>
    </div>


       <!-- ⭐ DAILY DEVOTIONAL SECTION ⭐ -->
       <section id="daily-devotional" class="section active">

        <!-- Date Navigation Section -->
        <div class="date-section">
            <!-- Date Display with Arrow Buttons -->
            <div class="date-display">
                <button class="nav-btn prev-btn" id="prevBtn" title="Previous Day (←)">←</button>
                <div class="current-date" id="dateDisplay">Loading...</div>
                <button class="nav-btn next-btn" id="nextBtn" title="Next Day (→)">→</button>
            </div>
            <!-- Calendar Toggle Button -->
            <button class="calendar-toggle" id="calendarToggle" title="Open Calendar">📅</button>
        </div>

        <!-- Expandable Calendar -->
        <div class="calendar-container" id="calendarContainer">
            <div class="calendar-header">
                <button class="calendar-nav" id="prevMonth" title="Previous Month">❮</button>
                <h2 id="monthYear">January 2026</h2>
                <button class="calendar-nav" id="nextMonth" title="Next Month">❯</button>
            </div>
            <!-- Calendar Weekday Headers -->
            <div class="calendar-weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            <!-- Calendar Days Grid -->
            <div class="calendar-days" id="calendarDays"></div>
        </div>
        <!-- Error Message -->
        <div class="error-message" id="errorMessage" style="display: none;"></div>
        <!-- Loading Indicator -->
        <div class="loading" id="loading" style="display: none;">Loading devotional...</div>
        <!-- Main Content -->
        <main class="devotional-content">
            <!-- Title -->
            <h2 id="title"></h2>
            <!-- Passage Section -->
            <div class="passage-section">
                <h3 id="passageRef"></h3>
                <p id="passageText"></p>
            </div>
            <!-- Article Content -->
            <article id="article"></article>
            <!-- Reflection Questions -->
            <section class="questions-section">
                <h3>✍️ Reflection Questions</h3>
                <div id="questionsContainer"></div>
            </section>
          <!-- ⭐ FINISHED DEVOTIONAL BUTTON ⭐ -->
                <div class="button-group">
                    <button id="finishedBtn" class="finished-btn">✅ Mark as Finished</button>
                </div>
                <!-- Streak Display -->
                <div id="streak-container">
                    <p id="streak-message">
                    You are on a <span id="streak-count">0</span> day streak 🔥 Keep going!
                    </p>
                </div>
        </main>
        </section>
    <!-- ⭐ SERMON SERIES SECTION ⭐ -->
       <section id="sermon-series" class="section">
           <div class="content-section">
               <h2>Sermon Series Introduction</h2>
               <div id="sermonContent"></div>
           </div>
       </section>
    <!-- ⭐ WHY SPEND TIME WITH GOD SECTION ⭐ -->
       <section id="why-spend-time" class="section">
           <div class="content-section">
               <h2>Why Spend Time with God</h2>
               <div id="whyContent"></div>
           </div>
       </section>

    </div>
    <!-- Scripts -->
    <!-- Use below for web testing
     <script src="/onethingwebapp/app.js?v=2.2.01" defer></script> -->
  
    <script src="/onethingwebapp/app.js?v=2.1.03" defer></script>
    <script type="module" src="/onethingwebapp/sync-widget.js"></script>
</body>
</html>
